name: ${NOVO_COMPOSE_PROJECT:-novo-eln}

services:
  novo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NOVO_BUILD_ID: ${NOVO_BUILD_ID:-unknown}
        NOVO_BUILD_DATE: ${NOVO_BUILD_DATE:-}
        NOVO_GIT_SHA: ${NOVO_GIT_SHA:-unknown}
    image: ${NOVO_IMAGE:-novo-eln:latest}
    container_name: ${NOVO_CONTAINER_NAME:-novo-eln}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOVO_HOST_PORT:-3148}:3000"
    env_file:
      - ${NOVO_ENV_FILE:-.env.local}
    environment:
      NODE_ENV: production
      ELN_DATA_DIR: /app-data/data
      ELN_UPLOAD_DIR: /app-data/uploads
      ELN_PREVIEW_DIR: /app-data/previews
      ELN_DATABASE_PATH: /app-data/data/eln.sqlite3
    volumes:
      - ${NOVO_RUNTIME_DIR:-./runtime}:/app-data
