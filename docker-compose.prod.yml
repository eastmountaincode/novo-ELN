name: novo-eln

services:
  novo:
    build:
      context: .
      dockerfile: Dockerfile
    image: novo-eln:latest
    container_name: novo-eln
    restart: unless-stopped
    ports:
      - "127.0.0.1:3155:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      ELN_DATA_DIR: /app-data/data
      ELN_UPLOAD_DIR: /app-data/uploads
      ELN_PREVIEW_DIR: /app-data/previews
      ELN_DATABASE_PATH: /app-data/data/eln.sqlite3
    volumes:
      - ./runtime:/app-data
