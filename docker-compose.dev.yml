name: novo-eln-dev

services:
  novo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: novo-eln-dev:latest
    container_name: novo-eln-dev
    ports:
      - "127.0.0.1:${ELN_DEV_PORT:-3155}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      ELN_SESSION_SECRET: ${ELN_SESSION_SECRET:-development-only-session-secret-change-me-before-shared-use}
      ELN_DATA_DIR: /app-data/data
      ELN_UPLOAD_DIR: /app-data/uploads
      ELN_PREVIEW_DIR: /app-data/previews
      ELN_DATABASE_PATH: /app-data/data/eln.sqlite3
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - novo-dev-node-modules:/app/node_modules
      - novo-dev-next:/app/.next
      - ./runtime-dev:/app-data
    command: sh -c "if [ ! -x node_modules/.bin/next ]; then npm ci; fi; npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  novo-dev-node-modules:
  novo-dev-next:
